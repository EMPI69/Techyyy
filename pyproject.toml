[project]
name = "caudal-bot"
dynamic = ["version"]
description = "Discord FAQ auto-responder with ticket escalation, transcripts and metrics."
requires-python = ">=3.11"

[tool.setuptools.dynamic]
version = { attr = "caudal_bot.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." makes caudal_bot importable without installing; "tests" exposes the shared helpers module.
pythonpath = [".", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    # discord.py imports the stdlib audioop module for voice, which this bot doesn't use.
    "ignore:'audioop' is deprecated:DeprecationWarning",
]
